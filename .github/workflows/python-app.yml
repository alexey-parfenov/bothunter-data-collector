name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile src/collector.py
          python -m py_compile src/models.py
          python -m py_compile src/health.py
          python -m py_compile src/storage.py
          
      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q
